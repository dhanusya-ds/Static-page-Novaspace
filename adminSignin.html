<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | NovaSpace</title>
    <link rel="stylesheet" href="adminSignin.css">
</head>

<body>
    <div class="container">
        <div class="login-box">
            <h1>Admin Login</h1>
            <p>
                Sign in to access the NovaSpace Admin Dashboard.
            </p>
            
            <form>
                <label>Email Address</label>
                <input
                    type="email"
                    placeholder="Enter admin email">

                <label>Password</label>
                <input
                    type="password"
                    placeholder="Enter password">

                <a href="adminDashboard.html" class="login-btn">
                    Sign In
                </a>

            </form>
            <a href="account.html" class="back">
                ← Back
            </a>
        </div>
    </div>
</body>
</html>
