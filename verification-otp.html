<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account | NovaSpace</title>
    <link rel="stylesheet" href="verification-otp.css">
</head>
<body>
    <div class="container">
        <div class="verify-card">
            <h1>Email Verification</h1>

            <p>
                We've sent a 6-digit verification code to your email address.
                Please enter it below to activate your NovaSpace account.
            </p>

            <form>
                <div class="otp-box">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                    <input type="text" maxlength="1">
                </div>

                <a href="signin.html" class="verify-btn">
                    Verify Account
                </a>
            </form>

            <p class="resend">
                Didn't receive the code?
                <a href="#">Resend OTP</a>
            </p>

        </div>
    </div>
</body>
</html>
