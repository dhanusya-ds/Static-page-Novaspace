<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | NovaSpace</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>NovaSpace</h2>
       
        <ul>
            <li class="active">Dashboard</li>
            <li><a href="index.html">Logout</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header>
            <h1>Dashboard</h1>
            <p>Welcome Back</p>
        </header>

        <!-- Cards -->
        <section class="cards">
            <div class="card">
                <h3>Projects</h3>
                <h2>2</h2>
            </div>

            <div class="card">
                <h3>Tasks</h3>
                <h2>5</h2>
            </div>

            <div class="card">
                <h3>Messages</h3>
                <h2>8</h2>
            </div>

            <div class="card">
                <h3>Notifications</h3>
                <h2>7</h2>
            </div>
        </section>

        <!-- Recent Projects -->
        <section class="projects">
            <h2>Recent Projects</h2>
            <table>
                <tr>
                    <th>Project</th>
                    <th>Status</th>
                    <th>Deadline</th>
                </tr>

                <tr>
                    <td>Website UI</td>
                    <td>Completed</td>
                    <td>15 Aug</td>
                </tr>

                <tr>
                    <td>Mobile App</td>
                    <td>In Progress</td>
                    <td>28 Aug</td>
                </tr>

                <tr>
                    <td>Portfolio</td>
                    <td>Pending</td>
                    <td>5 Sep</td>
                </tr>

            </table>
        </section>
    </main>
</body>
</html>
